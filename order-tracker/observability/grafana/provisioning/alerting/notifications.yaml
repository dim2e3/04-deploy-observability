apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          # The responder runs on the host (see incident-response/README.md).
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: ["grafana_folder", "alertname", "http_route"]
    group_wait: 10s
    group_interval: 1m
    # One investigation per incident; Grafana re-sends a still-firing alert only after this.
    repeat_interval: 4h
